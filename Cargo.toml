[workspace]
members = ["parc-core", "parc-cli", "parc-server"]
resolver = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The meaning model (parc_core::embed) runs its matrix products in tests too;
# unoptimised, they are a hundred times slower. Kept by hand: `cargo remove`
# drops profile entries for packages that aren't direct dependencies.
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
